spring.application.name=journal
spring.config.import=optional:file:./secrets.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/journal_db
spring.datasource.username=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.error.include-message=always

# Dosya yükleme (video için büyütüldü)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB
app.upload-dir=uploads
app.jwt.expiration-hours=168